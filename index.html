<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hodos, un générateur procédural de cartes du monde dans votre navigateur."
      data-i18n-content="page.description"
    />
    <title>Hodos</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./src/styles/map.scss" />
    <script>
      // The texts below are French until main.js translates them. When the page is going to
      // switch to English, they are hidden until then, instead of showing French for a moment.
      // Same choice as detectLanguage (i18n/i18n.js); initLanguage (ui/language.js) removes the flag.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("hodos.lang");
        } catch {
          // Storage unavailable: the browser languages decide
        }
        let language = ["fr", "en"].includes(saved) ? saved : null;
        const browserLanguages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language];
        for (const code of language ? [] : browserLanguages) {
          const lower = String(code).toLowerCase();
          if (lower.startsWith("fr") || lower.startsWith("en")) {
            language = lower.slice(0, 2);
            break;
          }
        }
        if ((language ?? "en") !== "fr") document.documentElement.dataset.translating = "";
      })();
    </script>
  </head>
  <body>
    <div class="main-content">
      <div class="header">
        <div class="logo">
          <img src="./src/assets/img/HodosLogoColorInvert.png" alt="Hodos" />
        </div>
      </div>
      <div id="map">
        <div class="map-controls">
          <button
            id="map-zoom-in-button"
            type="button"
            aria-label="Zoom avant"
            data-i18n-aria-label="map.zoomIn"
          >
            +
          </button>
          <button
            id="map-zoom-out-button"
            type="button"
            aria-label="Zoom arrière"
            data-i18n-aria-label="map.zoomOut"
          >
            -
          </button>
          <button
            id="map-recenter-button"
            type="button"
            aria-label="Recentrer la carte"
            data-i18n-aria-label="map.recenter"
          >
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <circle cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M8 0v5M8 11v5M0 8h5M11 8h5" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
          <button
            id="map-fullscreen-button"
            type="button"
            aria-label="Plein écran"
            data-i18n-aria-label="map.fullscreen"
            hidden
          >
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
          </button>
          <button
            id="screenshot"
            type="button"
            class="download-button"
            aria-label="Exporter la carte"
            data-i18n-aria-label="map.export"
            data-dialog="export-dialog"
          >
            <img src="./src/assets/img/download-button.png" alt="" />
          </button>
        </div>
      </div>
      <div class="borders-container">
        <div class="border-top"></div>
        <div class="border-left"></div>
        <div class="border-bottom"></div>
        <div class="border-right"></div>
      </div>
      <footer class="map-settings">
        <button
          type="button"
          class="setting-container"
          id="new-map-button"
          data-i18n="footer.newMap"
        >
          Nouvelle carte
        </button>
        <button
          type="button"
          class="setting-container"
          id="copy-link-button"
          data-i18n="footer.copyLink"
        >
          Copier le lien
        </button>
        <button
          type="button"
          class="setting-container"
          data-dialog="settings-dialog"
          data-i18n="footer.settings"
        >
          Paramètres
        </button>
        <button
          type="button"
          class="setting-container"
          data-dialog="project-dialog"
          data-i18n="footer.project"
        >
          Projet
        </button>
      </footer>
      <div id="notice" class="notice" role="status" hidden>
        <span class="notice-text"></span>
        <input
          class="notice-link"
          type="text"
          readonly
          hidden
          aria-label="Lien de la carte"
          data-i18n-aria-label="notice.link"
        />
      </div>
      <div id="hover-info" class="hover-info" aria-live="polite" hidden>
        <p><span data-i18n="hover.biome">Biome :</span> <span id="hover-biome"></span></p>
        <p><span data-i18n="hover.relief">Relief :</span> <span id="hover-relief"></span></p>
        <p id="hover-land-line"><span id="hover-land"></span></p>
      </div>
    </div>
    <dialog class="modal-box" id="settings-dialog" aria-labelledby="settings-title">
      <div class="inner">
        <div class="content">
          <div class="title">
            <div class="title-inner">
              <img class="upper" src="./src/assets/img/upperline.png" alt="" />
              <span id="settings-title" data-i18n="settings.title">Paramètres</span>
              <img class="under" src="./src/assets/img/underline.png" alt="" />
            </div>
          </div>
          <div class="main-modal-content">
            <div class="modal-section">
              <form action="" id="mode-form">
                <div>
                  <label for="default-toggle" data-i18n="settings.parchment">Parchemin :</label>
                  <input
                    id="default-toggle"
                    name="mode-toggle"
                    value="default"
                    type="radio"
                    checked
                  />
                </div>
                <div>
                  <label for="biomes-toggle" data-i18n="settings.biomes">Biomes :</label>
                  <input id="biomes-toggle" name="mode-toggle" value="biomes" type="radio" />
                </div>
                <div>
                  <label for="debug-toggle" data-i18n="settings.debug">Debug :</label>
                  <input id="debug-toggle" name="mode-toggle" value="debug" type="radio" />
                </div>
              </form>
            </div>
            <div class="modal-section">
              <form id="grid-form" class="options-form">
                <fieldset>
                  <legend data-i18n="settings.grid">Grille :</legend>
                  <label>
                    <input type="radio" name="grid-type" value="none" checked />
                    <span data-i18n="grid.none">Aucune</span>
                  </label>
                  <label>
                    <input type="radio" name="grid-type" value="square" />
                    <span data-i18n="grid.square">Carrés</span>
                  </label>
                  <label>
                    <input type="radio" name="grid-type" value="hex" />
                    <span data-i18n="grid.hex">Hexagones</span>
                  </label>
                </fieldset>
                <div>
                  <label for="grid-size" data-i18n="grid.size">Taille</label>
                  <input type="range" id="grid-size" min="100" max="1000" step="50" value="250" />
                </div>
                <div>
                  <label for="grid-opacity" data-i18n="grid.opacity">Opacité</label>
                  <input type="range" id="grid-opacity" min="10" max="100" step="1" value="40" />
                </div>
              </form>
            </div>
            <div class="modal-section">
              <div class="setting-row">
                <label for="hover-toggle" data-i18n="settings.hover">Infos au survol</label>
                <input type="checkbox" id="hover-toggle" />
              </div>
            </div>
            <div class="modal-section">
              <div class="setting-row">
                <label for="language-select" data-i18n="settings.language">Langue :</label>
                <select id="language-select">
                  <option value="fr" lang="fr">Français</option>
                  <option value="en" lang="en">English</option>
                </select>
              </div>
            </div>
            <div class="modal-section">
              <form id="seed-form">
                <div>
                  <label for="seed" data-i18n="settings.seed">Seed :</label>
                  <input
                    type="text"
                    class="seed-placeholder"
                    id="seed"
                    name="seed"
                    placeholder="un mot ou un nombre"
                    data-i18n-placeholder="settings.seedPlaceholder"
                  />
                  <button type="submit" data-i18n="settings.seedSubmit">Changer</button>
                </div>
              </form>
            </div>
          </div>
          <div class="back-desktop">
            <button type="button" class="dialog-close" data-i18n="dialog.back">Retour</button>
            <img class="underline" src="./src/assets/img/menu-underline.png" alt="" />
          </div>
        </div>
      </div>
    </dialog>
    <dialog class="modal-box" id="project-dialog" aria-labelledby="project-title">
      <div class="inner">
        <div class="content">
          <div class="title">
            <div class="title-inner">
              <span id="project-title" data-i18n="project.title">Projet</span>
              <img class="under" src="./src/assets/img/underline.png" alt="" />
            </div>
          </div>
          <div class="main-modal-content">
            <div class="modal-section">
              <p data-i18n-html="project.p1"></p>
              <p data-i18n-html="project.p2"></p>
              <p data-i18n-html="project.p3"></p>
              <p data-i18n-html="project.p4"></p>
            </div>
            <div class="modal-section">
              <a
                href="https://github.com/SmylerMC/Hodos"
                target="_blank"
                rel="noopener"
                class="github-link"
              >
                <img src="./src/assets/img/github.png" alt="GitHub" />
              </a>
            </div>
          </div>
          <div class="back-desktop">
            <button type="button" class="dialog-close" data-i18n="dialog.back">Retour</button>
            <img class="underline" src="./src/assets/img/menu-underline.png" alt="" />
          </div>
        </div>
      </div>
    </dialog>
    <dialog class="modal-box" id="export-dialog" aria-labelledby="export-title">
      <div class="inner">
        <div class="content">
          <div class="title">
            <div class="title-inner">
              <img class="upper" src="./src/assets/img/upperline.png" alt="" />
              <span id="export-title" data-i18n="export.title">Exporter</span>
              <img class="under" src="./src/assets/img/underline.png" alt="" />
            </div>
          </div>
          <div class="main-modal-content">
            <div class="modal-section">
              <form id="export-form" class="options-form">
                <fieldset>
                  <legend data-i18n="export.area">Zone :</legend>
                  <label>
                    <input type="radio" name="export-area" value="world" checked />
                    <span data-i18n="export.world">Monde entier</span>
                  </label>
                  <label>
                    <input type="radio" name="export-area" value="view" />
                    <span data-i18n="export.view">Vue actuelle</span>
                  </label>
                </fieldset>
                <div>
                  <label for="export-size" data-i18n="export.size">Taille :</label>
                  <select id="export-size"></select>
                </div>
                <div>
                  <label for="export-grid" data-i18n="export.includeGrid">Inclure la grille</label>
                  <input type="checkbox" id="export-grid" />
                </div>
                <button type="submit" id="export-download" data-i18n="export.download">
                  Télécharger (PNG)
                </button>
              </form>
            </div>
            <div class="modal-section">
              <form id="print-form" class="options-form">
                <div>
                  <label for="print-pages" data-i18n="print.pages">Imprimer :</label>
                  <select id="print-pages">
                    <option value="1" data-i18n="print.pages1">1 page A4</option>
                    <option value="2" data-i18n="print.pages2">2 × 2 pages A4</option>
                    <option value="3" data-i18n="print.pages3">3 × 3 pages A4</option>
                  </select>
                </div>
                <button type="submit" id="print-button" data-i18n="print.button">Imprimer…</button>
              </form>
            </div>
            <p id="export-status" class="export-status" role="status"></p>
          </div>
          <div class="back-desktop">
            <button type="button" class="dialog-close" data-i18n="dialog.back">Retour</button>
            <img class="underline" src="./src/assets/img/menu-underline.png" alt="" />
          </div>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
