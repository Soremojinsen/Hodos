<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hodos, un générateur procédural de cartes du monde dans votre navigateur."
      data-i18n-content="page.description"
    />
    <title>Hodos</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="main-content">
      <div class="header">
        <div class="logo">
          <img src="./src/assets/img/HodosLogoColorInvert.png" alt="Hodos" />
        </div>
      </div>
      <div id="map">
        <div class="map-controls">
          <button
            id="map-zoom-in-button"
            type="button"
            aria-label="Zoom avant"
            data-i18n-aria-label="map.zoomIn"
          >
            +
          </button>
          <button
            id="map-zoom-out-button"
            type="button"
            aria-label="Zoom arrière"
            data-i18n-aria-label="map.zoomOut"
          >
            -
          </button>
          <button
            id="screenshot"
            type="button"
            class="download-button"
            aria-label="Télécharger la carte"
            data-i18n-aria-label="map.download"
          >
            <img src="./src/assets/img/download-button.png" alt="" />
          </button>
        </div>
      </div>
      <div class="borders-container">
        <div class="border-top"></div>
        <div class="border-left"></div>
        <div class="border-bottom"></div>
        <div class="border-right"></div>
      </div>
      <footer class="map-settings">
        <button
          type="button"
          class="setting-container"
          id="new-map-button"
          data-i18n="footer.newMap"
        >
          Nouvelle carte
        </button>
        <button
          type="button"
          class="setting-container"
          id="copy-link-button"
          data-i18n="footer.copyLink"
        >
          Copier le lien
        </button>
        <button
          type="button"
          class="setting-container"
          data-dialog="settings-dialog"
          data-i18n="footer.settings"
        >
          Paramètres
        </button>
        <button
          type="button"
          class="setting-container"
          data-dialog="project-dialog"
          data-i18n="footer.project"
        >
          Projet
        </button>
      </footer>
      <div id="notice" class="notice" role="status" hidden>
        <span class="notice-text"></span>
        <input
          class="notice-link"
          type="text"
          readonly
          hidden
          aria-label="Lien de la carte"
          data-i18n-aria-label="notice.link"
        />
      </div>
    </div>
    <dialog class="modal-box" id="settings-dialog" aria-labelledby="settings-title">
      <div class="inner">
        <div class="content">
          <div class="title">
            <div class="title-inner">
              <img class="upper" src="./src/assets/img/upperline.png" alt="" />
              <span id="settings-title" data-i18n="settings.title">Paramètres</span>
              <img class="under" src="./src/assets/img/underline.png" alt="" />
            </div>
          </div>
          <div class="main-modal-content">
            <div class="modal-section">
              <form action="" id="mode-form">
                <div>
                  <label for="default-toggle" data-i18n="settings.parchment">Parchemin :</label>
                  <input
                    id="default-toggle"
                    name="mode-toggle"
                    value="default"
                    type="radio"
                    checked
                  />
                </div>
                <div>
                  <label for="biomes-toggle" data-i18n="settings.biomes">Biomes :</label>
                  <input id="biomes-toggle" name="mode-toggle" value="biomes" type="radio" />
                </div>
                <div>
                  <label for="debug-toggle" data-i18n="settings.debug">Debug :</label>
                  <input id="debug-toggle" name="mode-toggle" value="debug" type="radio" />
                </div>
              </form>
            </div>
            <div class="modal-section">
              <div class="setting-row">
                <label for="language-select" data-i18n="settings.language">Langue :</label>
                <select id="language-select">
                  <option value="fr" lang="fr">Français</option>
                  <option value="en" lang="en">English</option>
                </select>
              </div>
            </div>
            <div class="modal-section">
              <form id="seed-form">
                <div>
                  <label for="seed" data-i18n="settings.seed">Seed :</label>
                  <input
                    type="text"
                    class="seed-placeholder"
                    id="seed"
                    name="seed"
                    placeholder="un mot ou un nombre"
                    data-i18n-placeholder="settings.seedPlaceholder"
                  />
                  <button type="submit" data-i18n="settings.seedSubmit">Changer</button>
                </div>
              </form>
            </div>
          </div>
          <div class="back-desktop">
            <button type="button" class="dialog-close" data-i18n="dialog.back">Retour</button>
            <img class="underline" src="./src/assets/img/menu-underline.png" alt="" />
          </div>
        </div>
      </div>
    </dialog>
    <dialog class="modal-box" id="project-dialog" aria-labelledby="project-title">
      <div class="inner">
        <div class="content">
          <div class="title">
            <div class="title-inner">
              <span id="project-title" data-i18n="project.title">Projet</span>
              <img class="under" src="./src/assets/img/underline.png" alt="" />
            </div>
          </div>
          <div class="main-modal-content">
            <div class="modal-section">
              <p data-i18n-html="project.p1"></p>
              <p data-i18n-html="project.p2"></p>
              <p data-i18n-html="project.p3"></p>
              <p data-i18n-html="project.p4"></p>
            </div>
            <div class="modal-section">
              <a
                href="https://github.com/SmylerMC/Hodos"
                target="_blank"
                rel="noopener"
                class="github-link"
              >
                <img src="./src/assets/img/github.png" alt="GitHub" />
              </a>
            </div>
          </div>
          <div class="back-desktop">
            <button type="button" class="dialog-close" data-i18n="dialog.back">Retour</button>
            <img class="underline" src="./src/assets/img/menu-underline.png" alt="" />
          </div>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
